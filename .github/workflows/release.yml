name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify the Marketplace bundle
        run: |
          test -f dist/arcus.js
          node --check dist/arcus.js
          if grep -Eq "fonts.googleapis|unpkg|cdn.jsdelivr" dist/arcus.js; then
            echo "dist/arcus.js contains an external runtime URL."
            exit 1
          fi
      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/arcus.js
          fail_on_unmatched_files: true
          generate_release_notes: true
