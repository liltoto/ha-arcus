name: Visual

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Regenerate the Playwright baselines on ubuntu-26.04"
        type: boolean
        default: false

jobs:
  visual:
    # The screenshot baselines are generated on this image. Keep it pinned so
    # a GitHub runner rollover does not invalidate the visual suite.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Manual runs with `update_snapshots` rewrite the committed baselines and
      # upload them for a human to review and commit. Normal PR runs never
      # write snapshots, so they stay the source of truth for visual diffs.
      - name: Update baselines
        if: ${{ inputs.update_snapshots }}
        run: npx playwright test --update-snapshots

      - name: Upload updated baselines
        if: ${{ inputs.update_snapshots }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-baselines
          path: tests/visual/__screenshots__
          if-no-files-found: error

      - name: Run visual tests
        if: ${{ !inputs.update_snapshots }}
        run: npx playwright test

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
