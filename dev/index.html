<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arcus dev</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #080b0f; color: #f2ebe1; font-family: sans-serif; }
    arcus-card { display: block; height: 100vh; --header-height: 0px; }
    .pending { padding: 24px; color: #8a929e; }
  </style>
</head>
<body>
  <div class="pending" id="pending">Arcus dev harness — waiting for the card module…</div>
  <script type="module">
    import { makeConfig, makeHass } from "./fixture.js";
    await import("../dist/arcus.js");
    const el = document.createElement("arcus-card");
    document.body.appendChild(el);
    el.setConfig(makeConfig());
    setTimeout(() => el.hass = makeHass(), 40);
    document.getElementById("pending").remove();

    if (new URLSearchParams(location.search).get("full") === "1") {
      const style = document.createElement("style");
      style.textContent = `:host{height:auto!important;min-height:0!important}.app{height:auto!important;min-height:0!important;overflow:visible!important}.scroll{position:relative!important;inset:auto!important;height:auto!important;overflow:visible!important}`;
      setTimeout(() => el.shadowRoot.appendChild(style), 100);
    }
  </script>
</body>
</html>
